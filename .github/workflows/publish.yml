name: Publish image

on:
  push:
    branches: [main]
  # Rebuild every week so base-image and Node security patches reach Docker Hub
  # without a code change. Wednesday, after Monday's Dependabot updates merge.
  schedule:
    - cron: "17 9 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: pkmnct/macbid-ical

jobs:
  publish:
    name: Build, test and push
    runs-on: ubuntu-latest
    if: github.repository == 'pkmnct/macbid-ical'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Publishing is not gated on the CI workflow, so run its checks here too.
      # No npm audit: a new advisory must not block the weekly rebuild that
      # ships base-image security patches (CI already reports it)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Test exactly what is about to be published. Scheduled runs skip the
      # layer cache so they always pick up the newest base images.
      - name: Build for the runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: macbid-ical:ci

      - run: scripts/smoke-test.sh macbid-ical:ci

      - name: Date tag
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # No QEMU needed: every RUN step happens on the build platform
      - name: Build and push amd64 + arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.date }}
